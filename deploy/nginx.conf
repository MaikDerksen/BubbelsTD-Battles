# nginx als Reverse-Proxy vor dem Spiel-Server (Alternative zu Caddy).
# Zertifikat z. B. mit certbot holen. Server läuft auf 127.0.0.1:8080 mit TRUST_PROXY=1.
server {
    listen 80;
    server_name spiel.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name spiel.example.com;

    ssl_certificate     /etc/letsencrypt/live/spiel.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/spiel.example.com/privkey.pem;

    client_max_body_size 16k;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
}
